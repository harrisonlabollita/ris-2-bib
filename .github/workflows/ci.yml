name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so the two cannot drift apart again.
          go-version-file: go.mod
      - name: build and test
        run: |
          go build ./...
          go test -v ./...
